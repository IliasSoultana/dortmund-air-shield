/* =====================================================================
 * 2. UTILITIES & GEO PROJECTION (local ENU metres around ORIGIN)
 * ===================================================================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const nowMs = () => performance.now();
const hhmmss = d => d.toTimeString().slice(0, 8);
const fmtDur = s => { s = Math.floor(s); const h = String(Math.floor(s / 3600)).padStart(2, '0'); const m = String(Math.floor(s / 60) % 60).padStart(2, '0'); return `${h}:${m}:${String(s % 60).padStart(2, '0')}`; };

const M_PER_DEG_LAT = 110540;
const M_PER_DEG_LON = 111320 * Math.cos(CFG.ORIGIN.lat * Math.PI / 180);
const Geo = {
  toXY: (lat, lon) => ({ x: (lon - CFG.ORIGIN.lon) * M_PER_DEG_LON, y: (lat - CFG.ORIGIN.lat) * M_PER_DEG_LAT }),
  toLatLon: (x, y) => ({ lat: CFG.ORIGIN.lat + y / M_PER_DEG_LAT, lon: CFG.ORIGIN.lon + x / M_PER_DEG_LON }),
  dist3: (a, b) => Math.hypot(a.x - b.x, a.y - b.y, (a.alt || 0) - (b.alt || 0)),
};
const linkKey = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
const bandLabel = b => (b === 'WIFI' ? '2.4 GHz Mesh' : b === 'LORA' ? '868 MHz LoRa Fallback' : 'NO LINK');
const normBand = b => { const s = String(b).toUpperCase(); return s.includes('LORA') || s.includes('868') || s.includes('SUB') ? 'LORA' : s.includes('NONE') ? 'NONE' : 'WIFI'; };

class Emitter {
  constructor() { this._h = {}; }
  on(e, f) { (this._h[e] || (this._h[e] = [])).push(f); return () => this.off(e, f); }
  off(e, f) { this._h[e] = (this._h[e] || []).filter(x => x !== f); }
  emit(e, p) { (this._h[e] || []).forEach(f => { try { f(p); } catch (err) { console.error(err); } }); }
}

class Logger extends Emitter {
  constructor() { super(); this.lines = []; }
  log(level, msg) {
    const e = { ts: new Date(), level, msg };
    this.lines.push(e); if (this.lines.length > 400) this.lines.shift();
    this.emit('line', e);
  }
  info(m) { this.log('INFO', m); } ok(m) { this.log('OK', m); } warn(m) { this.log('WARN', m); }
  crit(m) { this.log('CRIT', m); } net(m) { this.log('NET', m); } debug(m) { this.log('DBG', m); }
}

/* =====================================================================
 * 3. DOMAIN MODEL — Drone, ThreatEnvironment
 * ===================================================================== */
class Drone {
  constructor(def, index) {
    this.id = def.id;
    this.index = index;
    const c = Geo.toXY(def.lat, def.lon);
    this.orbit = { cx: c.x, cy: c.y, r: def.r, w: def.dir * (def.v / def.r), phase: def.phase, ecc: def.ecc || 1, dir: def.dir };
    this.baseAlt = def.alt;
    this.battery = def.battery;
    this.reset();
  }
  reset() {
    const p = this.orbitTarget(0);
    this.x = p.x; this.y = p.y; this.alt = this.baseAlt;
    this.vx = 0; this.vy = 0; this.speed = 0; this.heading = 0;
    this.status = 'ONLINE';           // ONLINE | OFFLINE
    this.mode = 'MISSION';            // MISSION | RTH
    this.rebootAt = 0;
    this.gnss = 'OK';                 // OK | LOST | SPOOFED
    this.spoofOffset = { x: 0, y: 0 };
    this.spoofDetected = false;
    this.jam = 0;
    this.band = 'WIFI';               // WIFI | LORA | NONE
    this.route = null;                // [self, ..., 'HQ']
    this.lastRoute = null;            // route held before a break (unprotected mode only waits for it)
    this.offCourseWarned = false;
    this.routeState = 'JOINING';      // OK | REROUTING | ISOLATED | JOINING | DOWN
    this.lossStart = nowMs(); this.convergeAt = nowMs() + 600 + this.index * 80; this.routeChangedAt = -1e9;
    this.latency = 0; this.delivery = 0; this.pathCap = 0; this.hops = 0; this.linkQ = 0;
    this.external = null;
    this.overrides = {};
    this.lowBatWarned = false;
  }
  get lat() { return Geo.toLatLon(this.x, this.y).lat; }
  get lon() { return Geo.toLatLon(this.x, this.y).lon; }
  orbitTarget(t) {
    const o = this.orbit, a = o.phase + o.w * t;
    return { x: o.cx + o.r * Math.cos(a), y: o.cy + o.r * o.ecc * Math.sin(a) };
  }
  override(key, now) { const o = this.overrides[key]; return o && now < o.until ? o.v : null; }

  step(dt, t, sim) {
    const now = sim.now;
    if (this.status === 'OFFLINE') {
      this.vx = this.vy = this.speed = 0;
      this.alt = Math.max(this.alt - dt * 0.8, 40);
      if (this.rebootAt && now >= this.rebootAt) sim.rebootDrone(this);
      return;
    }
    const ext = this.external && now < this.external.until ? this.external : null;
    let target, vmax = 26;
    if (ext) { target = ext; vmax = 400; }
    else if (this.mode === 'RTH') {
      vmax = 60;
      const rr = 260 + this.index * 55, a = this.orbit.phase + t * 0.03 * this.orbit.dir;
      target = { x: sim.hq.x + rr * Math.cos(a), y: sim.hq.y + rr * Math.sin(a) };
    } else target = this.orbitTarget(t);
    // Without the plausibility check the autopilot trusts the spoofed fix, so it steers the real airframe off by the spoof offset.
    if (!ext && !sim.protection && this.gnss === 'SPOOFED') target = { x: target.x - this.spoofOffset.x, y: target.y - this.spoofOffset.y };

    const dx = target.x - this.x, dy = target.y - this.y, d = Math.hypot(dx, dy), maxStep = vmax * dt;
    const nx = d <= maxStep ? target.x : this.x + (dx / d) * maxStep;
    const ny = d <= maxStep ? target.y : this.y + (dy / d) * maxStep;
    if (dt > 0) {
      this.vx = lerp(this.vx, (nx - this.x) / dt, 0.15);
      this.vy = lerp(this.vy, (ny - this.y) / dt, 0.15);
    }
    this.x = nx; this.y = ny;
    this.speed = Math.hypot(this.vx, this.vy);
    if (this.speed > 0.5) this.heading = Math.atan2(this.vy, this.vx);

    const altT = ext && ext.alt != null ? ext.alt : this.mode === 'RTH' ? 55 + this.index * 7 : this.baseAlt + 7 * Math.sin(t * 0.04 + this.orbit.phase);
    this.alt = lerp(this.alt, altT, clamp(dt * 0.5, 0, 1));

    if (!(ext && ext.battery != null)) this.battery = Math.max(0, this.battery - dt * (0.004 + this.speed * 0.0003));
    if (this.battery < 20 && !this.lowBatWarned) { this.lowBatWarned = true; sim.logger.warn(`${this.id} battery low (${this.battery.toFixed(0)}%) – recommend RTH`); }

    this.updateGnss(dt, sim);
  }

  updateGnss(dt, sim) {
    const env = sim.env;
    this.jam = env.jamFactorAt(this.x, this.y);
    let g = this.jam > 0.55 ? 'LOST' : env.spoofFactorAt(this.x, this.y) > 0 ? 'SPOOFED' : 'OK';
    g = this.override('gnss', sim.now) || g;
    if (g !== this.gnss) { sim.onGnssChange(this, this.gnss, g); this.gnss = g; }
    const o = this.spoofOffset;
    if (g === 'SPOOFED') {
      o.x += env.spoofVec.x * dt; o.y += env.spoofVec.y * dt;
      const m = Math.hypot(o.x, o.y);
      if (sim.protection && !this.spoofDetected && m > 60) {
        this.spoofDetected = true;
        sim.logger.warn(`${this.id} GNSS plausibility FAILED (Δ=${m.toFixed(0)} m vs. INS/VIO) → GNSS rejected, INS navigation`);
      } else if (!sim.protection && !this.offCourseWarned && m > 60) {
        this.offCourseWarned = true;
        sim.logger.crit(`${this.id} following spoofed GNSS – no plausibility check, airframe ${m.toFixed(0)} m off course`);
      }
    } else {
      const k = Math.exp(-dt / 25); o.x *= k; o.y *= k;
      if (Math.hypot(o.x, o.y) < 5) { o.x = o.y = 0; this.spoofDetected = false; this.offCourseWarned = false; }
    }
  }
}

class ThreatEnvironment {
  constructor() {
    const z = Geo.toXY(CFG.ZONE.lat, CFG.ZONE.lon);
    this.zone = { x: z.x, y: z.y, radius: CFG.ZONE.radius, sector: CFG.ZONE.sector };
    this.jamming = false; this.spoofing = false;
    this.spoofVec = { x: -5, y: 4 };
    this.since = { jamming: 0, spoofing: 0 };
  }
  jamFactorAt(x, y) {
    if (!this.jamming) return 0;
    const d = Math.hypot(x - this.zone.x, y - this.zone.y), R = this.zone.radius;
    if (d <= R) return 1;
    if (d >= R * 1.35) return 0;
    return 1 - (d - R) / (0.35 * R);
  }
  spoofFactorAt(x, y) {
    if (!this.spoofing) return 0;
    return Math.hypot(x - this.zone.x, y - this.zone.y) <= this.zone.radius * 1.5 ? 1 : 0;
  }
  moveZone(x, y) { this.zone.x = x; this.zone.y = y; }
}

/* =====================================================================
 * 4. MESH NETWORK — link budget, band fallback, Dijkstra routing,
 *    route convergence (= measurable recovery time)
 * ===================================================================== */
class MeshNetwork {
  constructor(sim) {
    this.sim = sim;
    this.links = []; this.linkMap = new Map(); this.adj = new Map();
    this.prevKeys = new Set(); this.broken = [];
    this.routeEdges = new Set(); this.altEdges = new Set();
    this.external = null; this.externalUntil = 0;
  }
  applyExternal(list) {
    this.external = Array.isArray(list) ? list : (list && list.links) || [];
    this.externalUntil = this.sim.now + CFG.EXTERNAL_TTL_MS;
  }
  makeLink(a, b, band, q, jam = 0) {
    const env = this.sim.env;
    let latency, loss, cap;
    if (band === 'WIFI') {
      latency = 3 + 22 * Math.pow(1 - q, 1.5) + (env.jamming ? 5 : 0);
      loss = 0.001 + 0.05 * (1 - q) ** 2 + (env.jamming ? 0.008 : 0) + jam * 0.12;
      cap = CFG.WIFI_CAP_KBPS * q;
    } else {
      latency = 140 + 150 * (1 - q) + 60 * jam;
      loss = 0.025 + 0.10 * (1 - q) + 0.08 * jam;
      cap = CFG.LORA_CAP_KBPS;
    }
    latency *= rand(0.88, 1.22);
    return { key: linkKey(a.id, b.id), a: a.id, b: b.id, band, q, latency, loss: clamp(loss, 0, 0.95), cap, load: 0 };
  }

  compute() {
    const sim = this.sim, env = sim.env, now = sim.now;
    const online = sim.drones.filter(d => d.status !== 'OFFLINE');
    const nodes = [sim.hq, ...online];
    const links = [];
    const bandNext = new Map();

    if (this.external && now < this.externalUntil) {
      for (const l of this.external) {
        const a = sim.node(l.a), b = sim.node(l.b);
        if (!a || !b || a.status === 'OFFLINE' || b.status === 'OFFLINE') continue;
        links.push(this.makeLink(a, b, normBand(l.band || 'WIFI'), clamp(+l.quality || 0.7, 0.05, 1)));
      }
      for (const d of online) {
        const mine = links.filter(l => l.a === d.id || l.b === d.id);
        bandNext.set(d.id, mine.some(l => l.band === 'WIFI') ? 'WIFI' : mine.length ? 'LORA' : 'NONE');
      }
    } else {
      const jamOf = n => (n.id === 'HQ' ? 0 : n.jam);
      const forced = n => (n.id === 'HQ' ? null : n.override('band', now));
      const wifiDeg = new Map();
      for (let i = 0; i < nodes.length; i++) for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        if (forced(a) === 'LORA' || forced(b) === 'LORA') continue;
        const jam = Math.max(jamOf(a), jamOf(b));
        if (jam > 0.5) continue;
        const d = Geo.dist3(a, b);
        let q = 1 - Math.pow(d / CFG.WIFI_RANGE, 3);
        if (q <= 0) continue;
        q *= (1 - jam * 0.9) * (env.jamming ? 0.93 : 1);
        if (q < 0.12) continue;
        links.push(this.makeLink(a, b, 'WIFI', q, jam));
        wifiDeg.set(a.id, (wifiDeg.get(a.id) || 0) + 1);
        wifiDeg.set(b.id, (wifiDeg.get(b.id) || 0) + 1);
      }
      const loraAdded = new Set();
      for (const d of online) {
        if (!sim.protection && forced(d) !== 'LORA') { bandNext.set(d.id, wifiDeg.get(d.id) ? 'WIFI' : 'NONE'); continue; }
        const needLora = forced(d) === 'LORA' || d.jam > 0.5 || !wifiDeg.get(d.id);
        if (!needLora) { bandNext.set(d.id, 'WIFI'); continue; }
        const cands = nodes.filter(n => n !== d).map(n => ({ n, dd: Geo.dist3(d, n) }))
          .filter(c => c.dd < CFG.LORA_RANGE).sort((p, q) => p.dd - q.dd).slice(0, 3);
        bandNext.set(d.id, cands.length ? 'LORA' : 'NONE');
        for (const c of cands) {
          const k = linkKey(d.id, c.n.id);
          if (loraAdded.has(k)) continue;
          loraAdded.add(k);
          const q = (1 - Math.pow(c.dd / CFG.LORA_RANGE, 1.6)) * (1 - 0.3 * d.jam);
          links.push(this.makeLink(d, c.n, 'LORA', clamp(q, 0.05, 1), d.jam));
        }
      }
      if (sim.protection) this.bridgePartitions(nodes, links, bandNext, loraAdded);
    }

    for (const d of online) {
      const nb = bandNext.get(d.id) || 'NONE';
      if (nb !== d.band) sim.onBandChange(d, d.band, nb);
      d.band = nb;
    }

    this.links = links;
    this.linkMap = new Map(links.map(l => [l.key, l]));
    this.adj = new Map(nodes.map(n => [n.id, []]));
    for (const l of links) { this.adj.get(l.a).push({ to: l.b, l }); this.adj.get(l.b).push({ to: l.a, l }); }

    const curKeys = new Set(links.map(l => l.key));
    for (const k of this.prevKeys) if (!curKeys.has(k)) { const [a, b] = k.split('|'); this.broken.push({ a, b, t: now }); }
    this.broken = this.broken.filter(b => now - b.t < 2500 && !curKeys.has(linkKey(b.a, b.b)));
    this.prevKeys = curKeys;

    const prev = this.dijkstra(nodes);
    this.updateRoutes(online, prev);
    this.computePathStats(online);
  }

  // Islands that still mesh locally but lost every path to HQ: the member
  // closest to the reachable network opens an 868 MHz uplink for the group.
  bridgePartitions(nodes, links, bandNext, loraAdded) {
    for (let guard = 0; guard < nodes.length; guard++) {
      const adj = new Map(nodes.map(n => [n.id, []]));
      for (const l of links) { adj.get(l.a).push(l.b); adj.get(l.b).push(l.a); }
      const reach = new Set(['HQ']), queue = ['HQ'];
      while (queue.length) for (const nb of adj.get(queue.shift())) if (!reach.has(nb)) { reach.add(nb); queue.push(nb); }
      const inside = nodes.filter(n => reach.has(n.id)), outside = nodes.filter(n => !reach.has(n.id));
      let gw = null, gwDist = CFG.LORA_RANGE;
      for (const u of outside) for (const r of inside) {
        const dd = Geo.dist3(u, r);
        if (dd < gwDist) { gwDist = dd; gw = u; }
      }
      if (!gw) return;
      const cands = inside.map(n => ({ n, dd: Geo.dist3(gw, n) })).filter(c => c.dd < CFG.LORA_RANGE)
        .sort((p, q) => p.dd - q.dd).slice(0, 3);
      bandNext.set(gw.id, 'LORA');
      for (const c of cands) {
        const k = linkKey(gw.id, c.n.id);
        if (loraAdded.has(k)) continue;
        loraAdded.add(k);
        const q = (1 - Math.pow(c.dd / CFG.LORA_RANGE, 1.6)) * (1 - 0.3 * gw.jam);
        links.push(this.makeLink(gw, c.n, 'LORA', clamp(q, 0.05, 1), gw.jam));
      }
    }
  }

  edgeCost(l) { return l.latency + l.loss * 400 + (l.band === 'LORA' ? 120 : 0); }

  dijkstra(nodes) {
    const dist = new Map(nodes.map(n => [n.id, Infinity])), prev = new Map(), done = new Set();
    dist.set('HQ', 0);
    for (;;) {
      let u = null, best = Infinity;
      for (const [id, dv] of dist) if (!done.has(id) && dv < best) { best = dv; u = id; }
      if (u === null) break;
      done.add(u);
      for (const e of this.adj.get(u) || []) {
        const nd = best + this.edgeCost(e.l);
        if (nd < dist.get(e.to)) { dist.set(e.to, nd); prev.set(e.to, u); }
      }
    }
    return prev;
  }
  pathFrom(prev, id) {
    const p = [id]; let c = id, guard = 0;
    while (c !== 'HQ') { c = prev.get(c); if (c == null || ++guard > 64) return null; p.push(c); }
    return p;
  }
  pathCost(p) {
    if (!p) return Infinity;
    let c = 0;
    for (let i = 0; i < p.length - 1; i++) { const l = this.linkMap.get(linkKey(p[i], p[i + 1])); if (!l) return Infinity; c += this.edgeCost(l); }
    return c;
  }
  brokenHop(p) {
    for (let i = 0; i < p.length - 1; i++) if (!this.linkMap.has(linkKey(p[i], p[i + 1]))) return `${p[i]}↔${p[i + 1]}`;
    return '?';
  }
  convergenceDelay(p) {
    const hops = p ? p.length - 1 : 2;
    const lora = p && p.some((id, i) => i < p.length - 1 && this.linkMap.get(linkKey(id, p[i + 1]))?.band === 'LORA');
    return 450 + 220 * hops + (lora ? 900 : 0) + rand(0, 450);
  }

  updateRoutes(online, prev) {
    const sim = this.sim, now = sim.now, log = sim.logger;
    for (const d of online) {
      let best = this.pathFrom(prev, d.id);
      if (d.routeState === 'OK') {
        const curCost = this.pathCost(d.route);
        if (curCost < Infinity) {
          if (sim.protection && best && best.join() !== d.route.join() && this.pathCost(best) < curCost * 0.72) {
            d.route = best; d.routeChangedAt = now;
          }
          continue;
        }
        log.warn(sim.protection
          ? `${d.id} route lost (link ${this.brokenHop(d.route)} down) – mesh re-convergence started`
          : `${d.id} route lost (link ${this.brokenHop(d.route)} down) – no self-healing, waiting for the static route`);
        d.routeState = 'REROUTING'; d.lastRoute = d.route; d.route = null; d.lossStart = now; d.convergeAt = now + this.convergenceDelay(best);
      }
      if (d.routeState === 'DOWN') { d.routeState = 'JOINING'; d.lossStart = now; d.convergeAt = now + this.convergenceDelay(best); }
      if (!sim.protection && d.routeState !== 'JOINING') best = d.lastRoute && this.pathCost(d.lastRoute) < Infinity ? d.lastRoute : null;
      if (!best) {
        if (d.routeState === 'REROUTING' && now >= d.convergeAt) {
          d.routeState = 'ISOLATED';
          log.crit(`${d.id} NO ROUTE TO HQ – node isolated, autonomous loiter mode`);
        }
        continue;
      }
      if (d.routeState === 'ISOLATED') { d.routeState = 'REROUTING'; d.convergeAt = now + this.convergenceDelay(best); continue; }
      if (now >= d.convergeAt) {
        const wasJoining = d.routeState === 'JOINING';
        d.route = best; d.routeState = 'OK'; d.routeChangedAt = wasJoining ? -1e9 : now;
        const via = best.slice(1).join(' → ');
        if (wasJoining) { if (sim.booted) log.ok(`${d.id} joined mesh via ${via}`); }
        else {
          const rt = (now - d.lossStart) / 1000;
          sim.metrics.addRecovery(rt);
          log.ok(`${d.id} route healed in ${rt.toFixed(2)} s via ${via}`);
        }
      }
    }
  }

  computePathStats(online) {
    const now = this.sim.now;
    this.routeEdges = new Set(); this.altEdges = new Set();
    for (const l of this.links) l.load = 0;
    for (const d of online) {
      if (d.routeState !== 'OK' || !d.route) continue;
      const recent = now - d.routeChangedAt < 6000;
      for (let i = 0; i < d.route.length - 1; i++) {
        const k = linkKey(d.route[i], d.route[i + 1]);
        this.routeEdges.add(k); if (recent) this.altEdges.add(k);
        const l = this.linkMap.get(k); if (l) l.load++;
      }
    }
    for (const d of online) {
      if (d.routeState !== 'OK' || !d.route) { d.latency = 0; d.delivery = 0; d.pathCap = 0; d.hops = 0; d.linkQ = 0; continue; }
      let lat = 0, del = 1, cap = Infinity;
      for (let i = 0; i < d.route.length - 1; i++) {
        const l = this.linkMap.get(linkKey(d.route[i], d.route[i + 1]));
        lat += l.latency + 0.8; del *= 1 - l.loss; cap = Math.min(cap, l.cap / Math.max(1, l.load));
        if (i === 0) d.linkQ = l.q;
      }
      d.latency = lat * 2; d.delivery = del; d.pathCap = cap; d.hops = d.route.length - 1;
    }
  }
}

/* =====================================================================
 * 5. TRAFFIC ENGINE — strict-priority scheduler per path
 * ===================================================================== */
const TRAFFIC_CLASSES = [
  { key: 'c2',        name: 'C2 & EMERGENCY', tag: 'DSCP EF',   rgb: '239,68,68' },
  { key: 'telemetry', name: 'TELEMETRY',      tag: 'DSCP AF41', rgb: '6,182,212' },
  { key: 'inter',     name: 'INTER-DRONE',    tag: 'DSCP AF21', rgb: '16,185,129' },
  { key: 'video',     name: 'VIDEO',          tag: 'DSCP CS1',  rgb: '148,163,184' },
];

class TrafficEngine {
  constructor(sim) { this.sim = sim; this.stats = {}; this.policy = 'NOMINAL'; }
  compute() {
    const sim = this.sim, env = sim.env;
    const agg = Object.fromEntries(TRAFFIC_CLASSES.map(c => [c.key, { demand: 0, delivered: 0 }]));
    for (const d of sim.drones) {
      if (d.status !== 'ONLINE' || d.routeState === 'JOINING') continue;
      let avail = d.routeState === 'OK' ? d.pathCap : 0;
      if (!sim.protection) {
        // Best effort: every class asks for its full rate and the path is shared proportionally.
        const total = TRAFFIC_CLASSES.reduce((s, c) => s + CFG.DEMAND_KBPS[c.key], 0), share = Math.min(1, avail / total);
        for (const c of TRAFFIC_CLASSES) {
          const nominal = CFG.DEMAND_KBPS[c.key];
          agg[c.key].demand += nominal;
          agg[c.key].delivered += nominal * share * d.delivery;
        }
        continue;
      }
      for (const c of TRAFFIC_CLASSES) {
        const nominal = CFG.DEMAND_KBPS[c.key];
        let want = nominal;
        if (c.key === 'video') {
          if (d.band !== 'WIFI') want = 0;
          else if (env.jamming || sim.rth) want = nominal * 0.25;
        }
        const alloc = Math.min(want, avail); avail -= alloc;
        const delivery = c.key === 'c2' ? 1 - (1 - d.delivery) ** 3 : d.delivery; // C2 uses ARQ (3 attempts)
        agg[c.key].demand += nominal;
        agg[c.key].delivered += alloc * delivery;
      }
    }
    for (const c of TRAFFIC_CLASSES) {
      const a = agg[c.key], ratio = a.demand ? a.delivered / a.demand : 0;
      let status = ratio >= 0.95 ? 'NOMINAL' : ratio >= 0.6 ? 'DEGRADED' : ratio > 0.02 ? 'THROTTLED' : 'OFFLINE';
      if (sim.protection && c.key === 'video' && (env.jamming || sim.rth) && status !== 'OFFLINE') status = 'THROTTLED';
      this.stats[c.key] = { ratio, status, kbps: a.delivered, demand: a.demand };
    }
    this.policy = !sim.protection ? 'UNPROTECTED · BEST EFFORT' : sim.rth ? 'EMERGENCY · C2 FIRST' : env.jamming ? 'ANTI-JAM · VIDEO SHED' : 'NOMINAL';
  }
}

/* =====================================================================
 * 6. METRICS ENGINE — reachability, latency, loss, recovery time
 * ===================================================================== */
class MetricsEngine {
  constructor(sim) {
    this.sim = sim;
    this.v = { reach: 100, latency: 15, loss: 0.5, recovery: 0 };
    this.raw = { ...this.v };
    this.hist = { reach: [], latency: [], loss: [], recovery: [] };
    this.recoveries = []; this.lastRecovery = null; this.healing = false;
    this.override = null; this.overrideUntil = 0;
  }
  addRecovery(s) { this.recoveries.push(s); if (this.recoveries.length > 30) this.recoveries.shift(); this.lastRecovery = s; }
  get avgRecovery() { return this.recoveries.length ? this.recoveries.reduce((a, b) => a + b, 0) / this.recoveries.length : 0; }
  applyOverride(m) { this.override = { ...(this.override || {}), ...m }; this.overrideUntil = this.sim.now + CFG.EXTERNAL_TTL_MS; }
  get isOverridden() { return this.override && this.sim.now < this.overrideUntil; }
  compute() {
    const now = this.sim.now;
    const act = this.sim.drones.filter(d => d.status === 'ONLINE' && d.routeState !== 'JOINING');
    const ok = act.filter(d => d.routeState === 'OK');
    const healing = act.filter(d => d.routeState === 'REROUTING' || d.routeState === 'ISOLATED');
    const r = this.raw;
    r.reach = act.length ? (ok.length / act.length) * 100 : 0;
    r.latency = ok.length ? ok.reduce((s, d) => s + d.latency, 0) / ok.length : 0;
    r.loss = act.length ? (1 - ok.reduce((s, d) => s + d.delivery, 0) / act.length) * 100 : 100;
    this.healing = healing.length > 0;
    r.recovery = this.healing ? Math.max(...healing.map(d => (now - d.lossStart) / 1000)) : (this.lastRecovery ?? 0);
    if (this.isOverridden) {
      const o = this.override;
      if (o.reachability != null) r.reach = +o.reachability;
      if (o.latency_ms != null) r.latency = +o.latency_ms;
      if (o.packet_loss != null) r.loss = +o.packet_loss;
      if (o.recovery_s != null) r.recovery = +o.recovery_s;
    }
    for (const k of Object.keys(this.v)) this.v[k] = k === 'recovery' ? r[k] : lerp(this.v[k], r[k], 0.35);
  }
  sample() {
    for (const k of Object.keys(this.hist)) { this.hist[k].push(this.v[k]); if (this.hist[k].length > CFG.HISTORY) this.hist[k].shift(); }
  }
}

/* =====================================================================
 * 7. SIMULATION — state machine owning everything
 * ===================================================================== */
class Simulation extends Emitter {
  constructor() {
    super();
    this.logger = new Logger();
    this.env = new ThreatEnvironment();
    const hq = Geo.toXY(CFG.HQ.lat, CFG.HQ.lon);
    this.hq = { id: 'HQ', x: hq.x, y: hq.y, alt: CFG.HQ.alt, status: 'ONLINE', name: CFG.HQ.name };
    this.drones = FLEET.map((d, i) => new Drone(d, i));
    this.droneMap = new Map(this.drones.map(d => [d.id, d]));
    this.net = new MeshNetwork(this);
    this.traffic = new TrafficEngine(this);
    this.metrics = new MetricsEngine(this);
    this.simTime = 0; this.speed = 6; this.now = nowMs(); this.lastNet = 0;
    this.rth = false; this.booted = false; this.protection = true;
  }
  node(id) { return id === 'HQ' ? this.hq : this.droneMap.get(id); }

  tick(realDt) {
    this.now = nowMs();
    const dt = realDt * this.speed;
    this.simTime += dt;
    for (const d of this.drones) d.step(dt, this.simTime, this);
    if (this.now - this.lastNet >= CFG.NET_TICK_MS) {
      this.lastNet = this.now;
      this.net.compute(); this.traffic.compute(); this.metrics.compute();
      if (!this.booted && this.drones.every(d => d.routeState !== 'JOINING')) {
        this.booted = true;
        this.logger.ok(`Mesh converged · ${this.net.links.length} links · ${this.drones.filter(d => d.routeState === 'OK').length}/${this.drones.length} nodes reachable`);
      }
      this.emit('net');
    }
  }

  /* ---- reactions ---- */
  onGnssChange(d, from, to) {
    const L = this.logger;
    if (to === 'LOST') L.crit(`${d.id} GNSS SATELLITES LOST (0/14 SV, L1 jammed) → INS dead-reckoning`);
    else if (to === 'SPOOFED') L.warn(`${d.id} GNSS anomaly: uniform C/N0 + clock jump → spoofing suspected`);
    else if (from === 'LOST') L.ok(`${d.id} GNSS re-acquired (12 SV · HDOP 0.9)`);
    else if (from === 'SPOOFED') L.ok(`${d.id} left spoofing area – GNSS authenticated (OSNMA OK)`);
    this.emit('drone', d);
  }
  onBandChange(d, from, to) {
    const L = this.logger;
    if (to === 'LORA') {
      L.warn(`${d.id} signal loss on 2.4GHz (RSSI −97 dBm, SNR −4 dB)`);
      L.net(`${d.id} auto fallback to 868MHz LoRa (SF9 · 125 kHz)`);
    } else if (to === 'WIFI' && from === 'LORA') L.ok(`${d.id} 2.4GHz mesh link restored – leaving LoRa fallback`);
    else if (to === 'NONE') L.crit(`${d.id} all radio links lost (2.4 GHz + 868 MHz)`);
  }

  /* ---- commands (UI, demo script or backend) ---- */
  command(action, value, origin) { if (origin !== 'backend') this.emit('command', { action, value }); }

  setJamming(on, origin = 'ui') {
    if (this.env.jamming === on) return;
    this.env.jamming = on; this.env.since.jamming = this.now;
    if (on) this.logger.crit(`RF JAMMING DETECTED – ${this.env.zone.sector} · 2.4 GHz / 5.8 GHz / GNSS L1 noise floor +38 dB`);
    else this.logger.ok('Jamming ceased – spectrum nominal, noise floor −101 dBm');
    this.command('SET_JAMMING', on, origin); this.emit('env');
  }
  setSpoofing(on, origin = 'ui') {
    if (this.env.spoofing === on) return;
    this.env.spoofing = on; this.env.since.spoofing = this.now;
    if (on) {
      const a = rand(2.0, 2.6);
      this.env.spoofVec = { x: Math.cos(a) * 7, y: Math.sin(a) * 7 };
      this.logger.crit(`GNSS SPOOFING injected – ${this.env.zone.sector} · counterfeit L1 C/A signals`);
    } else this.logger.ok('GNSS spoofing source neutralised');
    this.command('SET_SPOOFING', on, origin); this.emit('env');
  }
  failDrone(d, { reboot = true, reason = 'heartbeat timeout (3×500 ms) · power bus fault' } = {}) {
    if (d.status === 'OFFLINE') return;
    d.status = 'OFFLINE'; d.route = null; d.routeState = 'DOWN'; d.band = 'NONE';
    d.rebootAt = reboot ? this.now + CFG.REBOOT_MS : 0;
    this.logger.crit(`${d.id} NODE FAILURE – ${reason}`);
    this.emit('drone', d);
  }
  failNodes(arg = 2, origin = 'ui') {
    let targets;
    if (Array.isArray(arg)) targets = arg.map(id => this.droneMap.get(id)).filter(Boolean);
    else {
      const pool = this.drones.filter(d => d.status === 'ONLINE');
      targets = [];
      for (let i = 0; i < Math.min(+arg || 2, pool.length - 1); i++) targets.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    }
    targets.forEach(d => this.failDrone(d));
    if (targets.length) this.logger.net(`Mesh: ${targets.length} node(s) withdrawn – recalculating routes (OLSR/BATMAN-style)`);
    this.command('FORCE_NODE_FAILURE', targets.map(d => d.id), origin); this.emit('env');
  }
  rebootDrone(d) {
    if (d.status !== 'OFFLINE') return;
    d.status = 'ONLINE'; d.rebootAt = 0; d.routeState = 'DOWN'; d.band = 'NONE';
    this.logger.info(`${d.id} watchdog reboot complete – radio stack up, joining mesh`);
    this.emit('drone', d); this.emit('env');
  }
  setProtection(on, origin = 'ui') {
    if (this.protection === on) return;
    this.protection = on;
    if (on) this.logger.ok('PROTECTION ON – LoRa fallback · GNSS plausibility check · mesh self-healing · C2-first QoS');
    else this.logger.crit('PROTECTION OFF – no LoRa fallback, GNSS trusted blindly, static routes, best-effort traffic');
    this.command('SET_PROTECTION', on, origin); this.emit('env');
  }
  setRTH(on, origin = 'ui') {
    if (this.rth === on) return;
    this.rth = on;
    this.drones.forEach(d => { d.mode = on ? 'RTH' : 'MISSION'; });
    if (on) this.logger.crit('SAFE-RETURN-HOME engaged – emergency protocol · C2 priority · video shed');
    else this.logger.ok('RTH released – fleet resuming mission orbits');
    this.command('SAFE_RETURN_HOME', on, origin); this.emit('env');
  }
  reset(origin = 'ui') {
    this.env.jamming = false; this.env.spoofing = false;
    const z = Geo.toXY(CFG.ZONE.lat, CFG.ZONE.lon); this.env.moveZone(z.x, z.y);
    this.rth = false; this.simTime = 0;
    this.drones.forEach(d => d.reset());
    this.metrics.recoveries = []; this.metrics.lastRecovery = null;
    this.booted = false;
    this.logger.info('Scenario reset – fleet re-initialised');
    this.command('RESET', true, origin); this.emit('env'); this.emit('fleet');
  }

  /* ---- backend ingestion ---- */
  addDrone(p) {
    const ll = p.lat != null ? { lat: +p.lat, lon: +p.lon } : CFG.ORIGIN;
    const d = new Drone({ id: p.id, lat: ll.lat, lon: ll.lon, r: 500, v: 10, dir: 1, phase: 0, alt: +p.alt || 100, battery: +p.battery || 100 }, this.drones.length);
    this.drones.push(d); this.droneMap.set(d.id, d);
    this.logger.info(`${d.id} registered by backend`);
    this.emit('fleet');
    return d;
  }
  applyDroneData(payload) {
    const list = Array.isArray(payload) ? payload : payload && Array.isArray(payload.drones) ? payload.drones : [payload];
    for (const p of list) {
      if (!p || !p.id) continue;
      const d = this.droneMap.get(p.id) || this.addDrone(p);
      const until = this.now + CFG.EXTERNAL_TTL_MS;
      let x = d.x, y = d.y;
      if (p.lat != null && p.lon != null) ({ x, y } = Geo.toXY(+p.lat, +p.lon));
      d.external = { x, y, alt: p.alt != null ? +p.alt : null, battery: p.battery, until };
      if (p.battery != null) d.battery = +p.battery;
      if (p.status) {
        const s = String(p.status).toUpperCase();
        if (s === 'OFFLINE') this.failDrone(d, { reboot: false, reason: 'reported OFFLINE by backend' });
        else if (d.status === 'OFFLINE') this.rebootDrone(d);
        if (s === 'RTH') d.mode = 'RTH'; else if (s === 'MISSION' || s === 'ONLINE') d.mode = this.rth ? 'RTH' : 'MISSION';
      }
      if (p.gnss) d.overrides.gnss = { v: String(p.gnss).toUpperCase(), until };
      if (p.band) d.overrides.band = { v: normBand(p.band), until };
    }
  }
  applyEvent(e = {}) {
    const t = String(e.type || e.event || '').toUpperCase(), on = e.active !== false;
    if (e.lat != null && e.lon != null) { const z = Geo.toXY(+e.lat, +e.lon); this.env.moveZone(z.x, z.y); }
    if (e.radius_m) this.env.zone.radius = +e.radius_m;
    switch (t) {
      case 'JAMMING': this.setJamming(on, 'backend'); break;
      case 'SPOOFING': case 'GPS_SPOOFING': this.setSpoofing(on, 'backend'); break;
      case 'NODE_FAILURE': this.failNodes(e.ids || e.count || 2, 'backend'); break;
      case 'NODE_RESTORE': (e.ids ? e.ids.map(id => this.droneMap.get(id)) : this.drones).filter(Boolean).forEach(d => this.rebootDrone(d)); break;
      case 'RTH': case 'SAFE_RETURN_HOME': this.setRTH(on, 'backend'); break;
      case 'PROTECTION': this.setProtection(on, 'backend'); break;
      case 'RESET': this.reset('backend'); break;
      case 'ZONE': this.emit('env'); break;
      default: this.logger.warn(`Unknown backend event: ${t || JSON.stringify(e)}`);
    }
  }
  getState() {
    return {
      ts: Date.now(), simTime: this.simTime,
      env: { jamming: this.env.jamming, spoofing: this.env.spoofing, rth: this.rth, protection: this.protection, zone: { ...Geo.toLatLon(this.env.zone.x, this.env.zone.y), radius_m: this.env.zone.radius } },
      metrics: { reachability: this.metrics.v.reach, latency_ms: this.metrics.v.latency, packet_loss: this.metrics.v.loss, recovery_s: this.metrics.v.recovery },
      traffic: this.traffic.stats,
      drones: this.drones.map(d => ({ id: d.id, lat: d.lat, lon: d.lon, alt: d.alt, speed: d.speed, battery: d.battery, status: d.status, mode: d.mode, band: d.band, gnss: d.gnss, route: d.route, routeState: d.routeState, latency_ms: d.latency })),
      links: this.net.links.map(l => ({ a: l.a, b: l.b, band: l.band, quality: +l.q.toFixed(3) })),
    };
  }
}

/* =====================================================================
 * 8. MAP RENDERER — Minimalist Tesla / Apple Maps Dark Mode Canvas 2D
 * ===================================================================== */
function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }

class MapRenderer extends Emitter {
  constructor(canvas, sim) {
    super();
    this.c = canvas; this.ctx = canvas.getContext('2d'); this.sim = sim;
    this.cam = { x: -1200, y: -200, s: 0.05 }; this.camTarget = null;
    this.layers = { labels: true, ranges: false, packets: true };
    this.particles = []; this.drops = [];
    this.selected = null; this.hover = null; this.mouse = null;
    const xy = ([lat, lon]) => Geo.toXY(lat, lon);
    this.base = {
      boundary: BASEMAP.boundary.map(xy), water: BASEMAP.water.map(l => l.map(xy)),
      roads: BASEMAP.roads.map(r => ({ ...r, pts: r.pts.map(xy) })),
      lakes: BASEMAP.lakes.map(l => ({ ...l, ...Geo.toXY(l.lat, l.lon) })),
      ring: { ...Geo.toXY(BASEMAP.ring.lat, BASEMAP.ring.lon), r: BASEMAP.ring.r },
    };
    this.resize();
    new ResizeObserver(() => this.resize()).observe(canvas.parentElement);
    this.bind();
    sim.on('net', () => this.spawnPackets());
  }
  resize() {
    const r = this.c.parentElement.getBoundingClientRect();
    this.w = r.width; this.h = r.height; this.dpr = window.devicePixelRatio || 1;
    this.c.width = Math.round(r.width * this.dpr); this.c.height = Math.round(r.height * this.dpr);
    if (!this.fitted && this.w > 0) { this.fit(false); this.fitted = true; }
  }
  fit(animate = true) {
    const t = { x: -900, y: -200, s: Math.min(this.w / 22000, this.h / 15000) };
    if (animate) this.camTarget = t; else Object.assign(this.cam, t);
  }
  zoom(f) { this.camTarget = { x: this.cam.x, y: this.cam.y, s: clamp(this.cam.s * f, 0.008, 0.6) }; }
  focus(d) { this.camTarget = { x: d.x, y: d.y, s: Math.max(this.cam.s, 0.075) }; }
  w2s(x, y) { return [this.w / 2 + (x - this.cam.x) * this.cam.s, this.h / 2 - (y - this.cam.y) * this.cam.s]; }
  s2w(sx, sy) { return [(sx - this.w / 2) / this.cam.s + this.cam.x, -(sy - this.h / 2) / this.cam.s + this.cam.y]; }

  select(id, focus) {
    this.selected = id; const d = this.sim.droneMap.get(id);
    if (d && focus) this.focus(d);
    this.emit('select', id);
  }
  pickDrone(sx, sy) {
    let best = null, bd = 18;
    for (const d of this.sim.drones) { const [x, y] = this.w2s(d.x, d.y); const dd = Math.hypot(x - sx, y - sy); if (dd < bd) { bd = dd; best = d; } }
    return best;
  }
  bind() {
    const c = this.c;
    let drag = null;
    c.addEventListener('wheel', e => {
      e.preventDefault(); this.camTarget = null;
      const [wx, wy] = this.s2w(e.offsetX, e.offsetY);
      this.cam.s = clamp(this.cam.s * Math.exp(-e.deltaY * 0.0015), 0.008, 0.6);
      this.cam.x = wx - (e.offsetX - this.w / 2) / this.cam.s;
      this.cam.y = wy + (e.offsetY - this.h / 2) / this.cam.s;
    }, { passive: false });
    c.addEventListener('pointerdown', e => { drag = { x: e.offsetX, y: e.offsetY, moved: 0 }; c.setPointerCapture(e.pointerId); });
    c.addEventListener('pointermove', e => {
      this.mouse = { x: e.offsetX, y: e.offsetY };
      if (drag) {
        const dx = e.offsetX - drag.x, dy = e.offsetY - drag.y;
        drag.moved += Math.abs(dx) + Math.abs(dy);
        if (drag.moved > 4) { c.classList.add('dragging'); this.camTarget = null; this.cam.x -= dx / this.cam.s; this.cam.y += dy / this.cam.s; }
        drag.x = e.offsetX; drag.y = e.offsetY;
      }
      this.hover = this.pickDrone(e.offsetX, e.offsetY);
    });
    c.addEventListener('pointerup', e => {
      c.classList.remove('dragging');
      if (drag && drag.moved <= 4) {
        if (e.shiftKey) {
          const [wx, wy] = this.s2w(e.offsetX, e.offsetY);
          this.sim.env.moveZone(wx, wy);
          const ll = Geo.toLatLon(wx, wy);
          this.sim.logger.info(`Threat zone relocated → ${ll.lat.toFixed(4)}°N ${ll.lon.toFixed(4)}°E`);
          this.sim.command('MOVE_ZONE', { lat: ll.lat, lon: ll.lon, radius_m: this.sim.env.zone.radius }, 'ui');
        } else {
          const d = this.pickDrone(e.offsetX, e.offsetY);
          this.select(d ? (this.selected === d.id ? null : d.id) : null, false);
        }
      }
      drag = null;
    });
    c.addEventListener('pointerleave', () => { this.mouse = null; this.hover = null; });
    c.addEventListener('dblclick', () => this.fit());
  }

  /* ---------- packets ---------- */
  spawnPackets() {
    if (!this.layers.packets) return;
    const sim = this.sim;
    for (const d of sim.drones) {
      if (d.status !== 'ONLINE' || d.routeState !== 'OK' || !d.route) continue;
      if (Math.random() < 0.35) this.addParticle(d.route, '#34D399');
    }
  }
  addParticle(path, color) { if (this.particles.length < 180 && path.length > 1) this.particles.push({ path, seg: 0, t: 0, color }); }
  updateParticles(dt) {
    const net = this.sim.net;
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      const l = net.linkMap.get(linkKey(p.path[p.seg], p.path[p.seg + 1]));
      if (!l) { this.dropAt(p); this.particles.splice(i, 1); continue; }
      const dur = l.band === 'LORA' ? 1.8 : 0.35 + l.latency / 180;
      p.t += dt / dur;
      if (p.t >= 1) {
        if (Math.random() < l.loss * 1.5) { this.dropAt(p); this.particles.splice(i, 1); continue; }
        p.seg++; p.t = 0;
        if (p.seg >= p.path.length - 1) this.particles.splice(i, 1);
      }
    }
    const now = this.sim.now;
    this.drops = this.drops.filter(d => now - d.t0 < 600);
  }
  particlePos(p) {
    const a = this.sim.node(p.path[p.seg]), b = this.sim.node(p.path[p.seg + 1]);
    if (!a || !b) return null;
    return { x: lerp(a.x, b.x, Math.min(p.t, 1)), y: lerp(a.y, b.y, Math.min(p.t, 1)) };
  }
  dropAt(p) { const pos = this.particlePos(p); if (pos) this.drops.push({ ...pos, t0: this.sim.now }); }

  /* ---------- frame ---------- */
  draw(dt) {
    const ctx = this.ctx, t = this.sim.now;
    if (this.camTarget) {
      const k = 1 - Math.exp(-dt * 6);
      for (const key of ['x', 'y', 's']) this.cam[key] = lerp(this.cam[key], this.camTarget[key], k);
      if (Math.abs(this.cam.s - this.camTarget.s) < 1e-5 && Math.abs(this.cam.x - this.camTarget.x) < 2 && Math.abs(this.cam.y - this.camTarget.y) < 2) this.camTarget = null;
    }
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);
    this.drawBackground();
    this.drawGrid();
    this.drawBase();
    this.drawZone(t);
    this.drawLinks(t);
    this.updateParticles(dt);
    if (this.layers.packets) this.drawParticles();
    this.drawHQ(t);
    this.drawDrones(t);
    this.updateSelectedCard();
  }

  drawBackground() {
    const ctx = this.ctx;
    ctx.fillStyle = '#0B0B0C';
    ctx.fillRect(0, 0, this.w, this.h);
  }
  drawGrid() {
    const ctx = this.ctx, s = this.cam.s;
    const step = s * 1000 > 55 ? 1000 : s * 2000 > 55 ? 2000 : 5000;
    const [x0, y1] = this.s2w(0, 0), [x1, y0] = this.s2w(this.w, this.h);
    ctx.lineWidth = 1;
    ctx.strokeStyle = '#121215';
    ctx.beginPath();
    for (let gx = Math.floor(x0 / step) * step; gx <= x1; gx += step) {
      const [sx] = this.w2s(gx, 0);
      ctx.moveTo(Math.round(sx) + 0.5, 0); ctx.lineTo(Math.round(sx) + 0.5, this.h);
    }
    for (let gy = Math.floor(y0 / step) * step; gy <= y1; gy += step) {
      const [, sy] = this.w2s(0, gy);
      ctx.moveTo(0, Math.round(sy) + 0.5); ctx.lineTo(this.w, Math.round(sy) + 0.5);
    }
    ctx.stroke();
  }
  pathOf(pts, close) {
    const ctx = this.ctx; ctx.beginPath();
    pts.forEach((p, i) => { const [x, y] = this.w2s(p.x, p.y); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
    if (close) ctx.closePath();
  }
  drawBase() {
    const ctx = this.ctx, b = this.base, s = this.cam.s;
    this.pathOf(b.boundary, true);
    ctx.fillStyle = 'rgba(255,255,255,0.008)'; ctx.fill();
    ctx.strokeStyle = '#19191D'; ctx.lineWidth = 1; ctx.stroke();

    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    for (const w of b.water) {
      this.pathOf(w);
      ctx.strokeStyle = '#131820'; ctx.lineWidth = 2.5; ctx.stroke();
    }
    for (const l of b.lakes) {
      const [x, y] = this.w2s(l.x, l.y);
      ctx.beginPath(); ctx.ellipse(x, y, Math.max(3, l.rx * s), Math.max(1.5, l.ry * s), -0.08, 0, Math.PI * 2);
      ctx.fillStyle = '#131820'; ctx.fill();
    }
    for (const r of b.roads) {
      this.pathOf(r.pts);
      ctx.strokeStyle = r.major ? '#19191C' : '#141417';
      ctx.lineWidth = r.major ? 2.2 : 1.3;
      ctx.stroke();
    }
    const [rx, ry] = this.w2s(b.ring.x, b.ring.y);
    ctx.beginPath(); ctx.arc(rx, ry, b.ring.r * s, 0, Math.PI * 2);
    ctx.strokeStyle = '#18181B'; ctx.lineWidth = 1.5; ctx.stroke();
  }

  drawZone(t) {
    const ctx = this.ctx, env = this.sim.env, z = env.zone, [sx, sy] = this.w2s(z.x, z.y), R = z.radius * this.cam.s;
    ctx.save();
    if (!env.jamming && !env.spoofing) {
      ctx.setLineDash([4, 8]); ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(sx, sy, R, 0, Math.PI * 2); ctx.stroke();
      ctx.restore(); return;
    }
    if (env.spoofing) {
      const R2 = R * 1.5;
      const g = ctx.createRadialGradient(sx, sy, R * 0.4, sx, sy, R2);
      g.addColorStop(0, 'rgba(245,158,11,0.03)'); g.addColorStop(1, 'rgba(245,158,11,0.09)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, R2, 0, Math.PI * 2); ctx.fill();
      ctx.setLineDash([6, 8]); ctx.strokeStyle = 'rgba(245,158,11,0.45)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(sx, sy, R2, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
    }
    if (env.jamming) {
      const g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R * 1.25);
      g.addColorStop(0, 'rgba(239,68,68,0.18)'); g.addColorStop(0.7, 'rgba(239,68,68,0.07)'); g.addColorStop(1, 'rgba(239,68,68,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy, R * 1.25, 0, Math.PI * 2); ctx.fill();
      const pulse = (t % 2400) / 2400;
      ctx.strokeStyle = `rgba(239,68,68,${(1 - pulse) * 0.35})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sx, sy, R * (0.3 + pulse * 0.7), 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(239,68,68,0.55)'; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.arc(sx, sy, R, 0, Math.PI * 2); ctx.stroke();
    }
    const label = env.jamming && env.spoofing ? 'JAMMING & SPOOFING · SECTOR OUEST' : env.jamming ? 'ACTIVE JAMMING · SECTOR OUEST' : 'GNSS SPOOFING · SECTOR OUEST';
    ctx.font = '600 10px Inter, -apple-system, sans-serif';
    ctx.fillStyle = env.jamming ? 'rgba(248,113,113,0.85)' : 'rgba(251,191,36,0.85)';
    ctx.textAlign = 'center';
    ctx.fillText(label, sx, sy - R - 10);
    ctx.restore();
  }

  drawLinks(t) {
    const ctx = this.ctx, net = this.sim.net;
    ctx.save(); ctx.lineCap = 'round';
    for (const l of net.links) {
      const a = this.sim.node(l.a), b = this.sim.node(l.b); if (!a || !b) continue;
      const [ax, ay] = this.w2s(a.x, a.y), [bx, by] = this.w2s(b.x, b.y);
      const used = net.routeEdges.has(l.key), alt = net.altEdges.has(l.key);
      if (l.band === 'LORA') {
        ctx.shadowColor = '#EF4444'; ctx.shadowBlur = 8;
        ctx.strokeStyle = rgba('#EF4444', used ? 0.85 : 0.5);
        ctx.lineWidth = 1.5; ctx.setLineDash([2, 6]); ctx.lineDashOffset = -t * 0.008;
      } else if (alt || l.q < 0.32) {
        ctx.shadowColor = '#F59E0B'; ctx.shadowBlur = 6;
        ctx.strokeStyle = rgba('#F59E0B', used ? 0.8 : 0.45);
        ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]); ctx.lineDashOffset = -t * 0.015;
      } else {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = rgba('#34D399', used ? 0.6 : 0.22);
        ctx.lineWidth = 1.5; ctx.setLineDash([]);
      }
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
    ctx.shadowBlur = 0;
    for (const br of net.broken) {
      const a = this.sim.node(br.a), b = this.sim.node(br.b); if (!a || !b) continue;
      const age = (this.sim.now - br.t) / 2500, [ax, ay] = this.w2s(a.x, a.y), [bx, by] = this.w2s(b.x, b.y);
      ctx.strokeStyle = rgba('#EF4444', 0.65 * (1 - age)); ctx.lineWidth = 1.5; ctx.setLineDash([2, 5]);
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    }
    ctx.restore();
  }

  drawParticles() {
    const ctx = this.ctx;
    for (const p of this.particles) {
      const pos = this.particlePos(p); if (!pos) continue;
      const [x, y] = this.w2s(pos.x, pos.y);
      ctx.fillStyle = 'rgba(250,250,250,0.75)';
      ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }

  drawHQ(t) {
    const ctx = this.ctx, hq = this.sim.hq, [x, y] = this.w2s(hq.x, hq.y), rth = this.sim.rth;
    const col = rth ? '#EF4444' : '#FAFAFA';
    ctx.save();
    if (rth) {
      const p = (t % 1800) / 1800;
      ctx.strokeStyle = rgba('#EF4444', (1 - p) * 0.5); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, 10 + p * 36, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.shadowColor = 'rgba(0,0,0,0.7)'; ctx.shadowBlur = 10;
    ctx.fillStyle = '#18181B';
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = col; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
    ctx.font = '600 10px Inter, -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(250,250,250,0.65)';
    ctx.textAlign = 'center';
    ctx.fillText('HQ', x, y + 21);
    ctx.restore();
  }

  isDistressed(d) {
    if (d.status === 'OFFLINE' || d.routeState === 'ISOLATED' || d.band === 'NONE' || d.gnss === 'LOST') return 'crit';
    if (d.band === 'LORA' || d.routeState === 'REROUTING' || d.gnss === 'SPOOFED') return 'warn';
    return null;
  }

  drawDrones(t) {
    const ctx = this.ctx;
    const pulse = 0.5 + 0.5 * Math.sin(t * 0.008);
    ctx.save();

    for (const d of this.sim.drones) {
      const o = d.spoofOffset, om = Math.hypot(o.x, o.y);
      if (om > 8 && d.status === 'ONLINE') {
        const [gx, gy] = this.w2s(d.x + o.x, d.y + o.y), [x, y] = this.w2s(d.x, d.y);
        ctx.setLineDash([2, 4]); ctx.strokeStyle = 'rgba(245,158,11,0.5)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(gx, gy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(245,158,11,0.7)';
        ctx.beginPath(); ctx.arc(gx, gy, 3, 0, Math.PI * 2); ctx.fill();
      }
    }

    for (const d of this.sim.drones) {
      const [x, y] = this.w2s(d.x, d.y);
      const distress = this.isDistressed(d);
      const isSel = d.id === this.selected || d.id === this.hover?.id;

      // Subtle selection halo
      if (isSel) {
        ctx.strokeStyle = 'rgba(250,250,250,0.35)';
        ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.stroke();
      }

      // 3D-style sleek white/silver chevron (10px) with drop shadow
      ctx.save();
      ctx.translate(x, y);
      if (d.status === 'OFFLINE') {
        ctx.fillStyle = '#3F3F46';
        ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.rotate(-d.heading);
        ctx.shadowColor = 'rgba(0,0,0,0.75)';
        ctx.shadowBlur = 8;
        ctx.shadowOffsetY = 2;
        const grad = ctx.createLinearGradient(-6, -5, 7, 5);
        grad.addColorStop(0, '#FFFFFF');
        grad.addColorStop(1, '#B4B4BC');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(6.5, 0);
        ctx.lineTo(-5, 4.8);
        ctx.lineTo(-2.2, 0);
        ctx.lineTo(-5, -4.8);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // Tiny pulsing red/amber dot ONLY if drone is in distress
      if (distress) {
        const dotCol = distress === 'crit' ? '#EF4444' : '#F59E0B';
        ctx.save();
        ctx.fillStyle = rgba(dotCol, 0.25 + 0.35 * pulse);
        ctx.beginPath(); ctx.arc(x - 7, y - 7, 5.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = dotCol;
        ctx.beginPath(); ctx.arc(x - 7, y - 7, 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }

      // Tiny clean text label "01", "02" next to chevron (11px Inter, muted white, no border box)
      const shortNum = d.id.replace(/^DR-/, '');
      ctx.font = '500 11px Inter, -apple-system, sans-serif';
      ctx.fillStyle = d.status === 'OFFLINE' ? 'rgba(161,161,170,0.4)' : isSel ? '#FAFAFA' : 'rgba(250,250,250,0.68)';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(shortNum, x + 10, y + 0.5);
    }
    ctx.restore();
  }

  updateSelectedCard() {
    const el = document.getElementById('nodeCard');
    const d = this.selected ? this.sim.droneMap.get(this.selected) : null;
    if (!d) { el.classList.add('hidden'); return; }
    const [sx, sy] = this.w2s(d.x, d.y);
    el.classList.remove('hidden');
    const distress = this.isDistressed(d);
    const badgeCls = distress === 'crit' ? 'crit' : distress === 'warn' ? 'warn' : '';
    const badgeTxt = d.status === 'OFFLINE' ? 'OFFLINE' : d.gnss === 'LOST' ? 'GNSS LOST' : d.gnss === 'SPOOFED' ? 'SPOOFED' : d.band === 'LORA' ? '868 MHz LoRa' : '2.4 GHz Mesh';
    const ip = `10.41.0.${d.index + 1}`;
    const route = d.route ? d.route.join(' → ') : d.routeState;
    el.innerHTML = `
      <div class="nc-top">
        <span class="nc-id">${d.id} <span style="color:var(--mut);font-weight:400;font-size:11px">(${ip})</span></span>
        <span class="nc-badge ${badgeCls}">${badgeTxt}</span>
      </div>
      <div class="nc-grid">
        <div><span>Altitude</span><b>${d.alt.toFixed(0)} m</b></div>
        <div><span>Speed</span><b>${(d.speed * 3.6).toFixed(0)} km/h</b></div>
        <div><span>Battery</span><b>${d.battery.toFixed(0)}%</b></div>
        <div><span>Latency / Hops</span><b>${d.routeState === 'OK' ? `${d.latency.toFixed(0)} ms · ${d.hops}H` : '—'}</b></div>
      </div>
      <div class="nc-route">Route: ${route}</div>`;
    const cx = clamp(sx, 140, this.w - 140);
    const cy = clamp(sy, 140, this.h - 40);
    el.style.left = `${cx}px`;
    el.style.top = `${cy}px`;
  }
}

/* =====================================================================
 * 9. BACKEND BRIDGE — WebSocket / REST polling / global callbacks
 * ===================================================================== */
class BackendBridge extends Emitter {
  constructor(sim) {
    super();
    this.sim = sim; this.ws = null; this.state = 'MOCK'; this.retry = 0; this.timer = null; this.pollTimer = null;
    sim.on('command', c => this.send({ type: 'command', ...c, ts: Date.now() }));
  }
  setState(s) { this.state = s; this.emit('state', s); }
  connect(url) {
    this.disconnect(true);
    this.url = url; this.manualClose = false;
    let ws;
    try { ws = new WebSocket(url); } catch (e) { this.sim.logger.crit(`WS: invalid URL ${url}`); this.setState('MOCK'); return; }
    this.ws = ws; this.setState('CONNECTING');
    this.sim.logger.info(`WS: connecting to ${url} …`);
    ws.onopen = () => {
      this.retry = 0; this.setState('LIVE');
      this.sim.logger.ok(`Backend link established · ${url}`);
      this.send({ type: 'hello', client: 'dortmund-air-shield', version: CFG.VERSION, fleet: this.sim.drones.map(d => d.id) });
    };
    ws.onmessage = ev => this.handle(ev.data);
    ws.onclose = () => {
      if (this.ws !== ws) return;
      this.ws = null;
      if (this.manualClose) { this.setState('MOCK'); return; }
      const delay = Math.min(15000, 1000 * 2 ** this.retry++);
      this.setState('RECONNECTING');
      this.sim.logger.warn(`WS: backend unreachable – retry in ${(delay / 1000).toFixed(0)} s (mock sim continues)`);
      this.timer = setTimeout(() => this.connect(url), delay);
    };
  }
  disconnect(silent) {
    this.manualClose = true; clearTimeout(this.timer);
    const ws = this.ws; this.ws = null; if (ws) ws.close();
    if (!silent) { this.setState('MOCK'); this.sim.logger.info('WS: disconnected – mock simulation authoritative'); }
  }
  send(obj) { if (this.ws && this.ws.readyState === 1) this.ws.send(JSON.stringify(obj)); }
  poll(url, intervalMs = 1000) {
    this.stopPolling();
    const run = () => fetch(url, { cache: 'no-store' }).then(r => r.json()).then(j => this.handle(j)).catch(e => console.warn('poll failed', e));
    run(); this.pollTimer = setInterval(run, intervalMs);
    this.sim.logger.info(`REST: polling ${url} every ${intervalMs} ms`);
  }
  stopPolling() { clearInterval(this.pollTimer); this.pollTimer = null; }
  handle(msg) {
    if (typeof msg === 'string') { try { msg = JSON.parse(msg); } catch { return; } }
    if (!msg) return;
    if (Array.isArray(msg)) { this.sim.applyDroneData(msg); return; }
    const type = String(msg.type || '').toLowerCase(), data = msg.data ?? msg.payload ?? msg;
    switch (type) {
      case 'drones': case 'drone': case 'telemetry': case 'drone_update': this.sim.applyDroneData(data); break;
      case 'event': this.sim.applyEvent(data); break;
      case 'metrics': this.sim.metrics.applyOverride(data); break;
      case 'links': case 'mesh': this.sim.net.applyExternal(data); break;
      case 'log': this.sim.logger.log(String(data.level || 'INFO').toUpperCase(), data.msg || data.message || ''); break;
      case 'state_request': this.send({ type: 'state', data: this.sim.getState() }); break;
      default:
        if (msg.drones) this.sim.applyDroneData(msg.drones);
        if (msg.metrics) this.sim.metrics.applyOverride(msg.metrics);
        if (msg.links) this.sim.net.applyExternal(msg.links);
        if (msg.events) [].concat(msg.events).forEach(e => this.sim.applyEvent(e));
        if (msg.id) this.sim.applyDroneData(msg);
    }
  }
}

/* =====================================================================
 * 10. UI CONTROLLER — Minimalist Tesla App Floating Panels & Dock
 * ===================================================================== */
const KPIS = [
  { key: 'reach', label: 'REACHABILITY', unit: '%', target: 'Target >95%', fmt: v => v.toFixed(1),
    state: v => (v >= 95 ? 'ok' : v >= 80 ? 'warn' : 'crit'), max: 100 },
  { key: 'latency', label: 'AVG LATENCY', unit: 'ms', target: 'Target <50 ms', fmt: v => v.toFixed(0),
    state: v => (v < 50 ? 'ok' : v < 150 ? 'warn' : 'crit'), max: 400 },
  { key: 'loss', label: 'PACKET LOSS', unit: '%', target: 'Target <2%', fmt: v => v.toFixed(1),
    state: v => (v < 2 ? 'ok' : v < 8 ? 'warn' : 'crit'), max: 30 },
  { key: 'recovery', label: 'RECOVERY TIME', unit: 's', target: 'Target <3.0 s', fmt: v => v.toFixed(2),
    state: v => (v < 3 ? 'ok' : v < 6 ? 'warn' : 'crit'), max: 10 },
];

const QOS_ROWS = [
  { key: 'c2',        name: 'C2',              color: '#EF4444' },
  { key: 'telemetry', name: 'Telemetry',       color: '#38BDF8' },
  { key: 'inter',     name: 'Inter-Drone',     color: '#34D399' },
  { key: 'video',     name: 'Video (MediaMTX)',color: '#A1A1AA' },
];

class UI {
  constructor(sim, map, bridge) {
    this.sim = sim; this.map = map; this.bridge = bridge;
    this.$ = id => document.getElementById(id);
    this.follow = true; this.demoTimers = [];
    this.buildFleet(); this.buildKPIs(); this.buildTraffic(); this.bindControls();
    sim.logger.on('line', e => this.appendLog(e));
    sim.on('env', () => this.updateControls());
    sim.on('fleet', () => this.buildFleet());
    map.on('select', id => this.highlightCard(id));
    bridge.on('state', s => this.updateSource(s));
    this.updateControls();
  }

  buildFleet() {
    const list = this.$('fleetList'); list.innerHTML = ''; this.cards = new Map();
    for (const d of this.sim.drones) {
      const ip = `10.41.0.${d.index + 1}`;
      const el = document.createElement('div');
      el.className = 'drow';
      el.innerHTML = `
        <div class="drow-main">
          <span class="st-dot"></span>
          <span class="drow-id">${d.id}</span>
          <span class="drow-ip">(${ip})</span>
          <span class="drow-band">2.4 GHz</span>
          <span class="drow-rtt">12ms</span>
        </div>
        <div class="drow-detail">
          <div class="dd-cell"><span>Altitude</span><b class="v-alt">0 m</b></div>
          <div class="dd-cell"><span>Speed</span><b class="v-spd">0 km/h</b></div>
          <div class="dd-cell"><span>Battery</span><b class="v-bat">0%</b></div>
          <div class="dd-cell"><span>Hops</span><b class="v-hops">1</b></div>
          <div class="dd-cell"><span>Mesh IP</span><b>${ip}</b></div>
          <div class="dd-cell"><span>GNSS</span><b class="v-gnss">3D Fix</b></div>
        </div>`;
      const q = s => el.querySelector(s);
      this.cards.set(d.id, {
        el, ip,
        dot: q('.st-dot'), band: q('.drow-band'), rtt: q('.drow-rtt'),
        alt: q('.v-alt'), spd: q('.v-spd'), bat: q('.v-bat'), hops: q('.v-hops'), gnss: q('.v-gnss'),
      });
      q('.drow-main').addEventListener('click', () => {
        const next = this.map.selected === d.id ? null : d.id;
        this.map.select(next, !!next);
      });
      list.appendChild(el);
    }
    this.$('fleetCount').textContent = `${this.sim.drones.length} Nodes · FANET`;
  }

  highlightCard(id) {
    for (const [cid, c] of this.cards) c.el.classList.toggle('selected', cid === id);
    const c = id && this.cards.get(id);
    if (c) c.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  buildKPIs() {
    const host = this.$('gauges'); host.innerHTML = ''; this.gauges = {};
    for (const g of KPIS) {
      const el = document.createElement('div');
      el.className = 'kpi';
      el.innerHTML = `
        <div class="kpi-label">${g.label}</div>
        <div class="kpi-val"><span class="g-num">—</span><span class="unit">${g.unit}</span></div>
        <div class="kpi-sub"><span>${g.target}</span><span class="g-extra"></span></div>
        <canvas class="kpi-spark"></canvas>`;
      host.appendChild(el);
      this.gauges[g.key] = {
        def: g, el,
        valWrap: el.querySelector('.kpi-val'),
        num: el.querySelector('.g-num'),
        extra: el.querySelector('.g-extra'),
        spark: el.querySelector('.kpi-spark'),
      };
    }
  }

  buildTraffic() {
    const host = this.$('traffic'); host.innerHTML = ''; this.tc = {};
    QOS_ROWS.forEach(c => {
      const el = document.createElement('div');
      el.className = 'qos-row';
      el.innerHTML = `
        <div class="qos-head">
          <span class="qos-name"><span class="qos-dot" style="background:${c.color}"></span>${c.name}</span>
          <span class="qos-meta">—</span>
        </div>
        <div class="qos-track"><div class="qos-fill" style="width:0%;background:${c.color}"></div></div>`;
      host.appendChild(el);
      this.tc[c.key] = { el, c, fill: el.querySelector('.qos-fill'), meta: el.querySelector('.qos-meta') };
    });
  }

  bindControls() {
    const s = this.sim;
    this.$('btnJam').onclick = () => s.setJamming(!s.env.jamming);
    this.$('btnSpoof').onclick = () => s.setSpoofing(!s.env.spoofing);
    this.$('btnFail').onclick = () => s.failNodes(2);
    this.$('btnRth').onclick = () => s.setRTH(!s.rth);
    this.$('btnProt').onclick = () => s.setProtection(!s.protection);
    this.$('btnReset').onclick = () => { this.stopDemo(); s.reset(); };
    this.$('btnDemo').onclick = () => (this.demoTimers.length ? this.stopDemo(true) : this.runDemo());
    this.$('srcBox').onclick = () => this.$('wsBar').classList.toggle('hidden');
    this.$('wsBtn').onclick = () => (this.bridge.state === 'MOCK' ? this.bridge.connect(this.$('wsUrl').value.trim()) : this.bridge.disconnect());
    this.$('zIn').onclick = () => this.map.zoom(1.4);
    this.$('zOut').onclick = () => this.map.zoom(1 / 1.4);
    this.$('zFit').onclick = () => this.map.fit();
    document.querySelectorAll('#speedSeg button').forEach(b => b.onclick = () => {
      s.speed = +b.dataset.speed;
      document.querySelectorAll('#speedSeg button').forEach(x => x.classList.toggle('on', x === b));
    });
    this.$('toastBar').onclick = () => {
      const dr = this.$('logDrawer');
      const open = dr.classList.toggle('hidden');
      this.$('toastBar').classList.toggle('open', !open);
    };
    this.$('logClear').onclick = e => { e.stopPropagation(); this.$('log').innerHTML = ''; };
    this.$('logFollow').onclick = e => {
      e.stopPropagation();
      this.follow = !this.follow;
      this.$('logFollow').textContent = this.follow ? 'Auto-Scroll' : 'Paused';
    };
    window.addEventListener('keydown', e => {
      if (e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey) return;
      const k = e.key.toLowerCase();
      if (k === 'j') this.$('btnJam').click(); else if (k === 'g') this.$('btnSpoof').click();
      else if (k === 'f') this.$('btnFail').click(); else if (k === 'r') this.$('btnRth').click();
      else if (k === 'p') this.$('btnProt').click();
      else if (k === 'escape') this.map.select(null);
    });
  }

  runDemo() {
    const s = this.sim, L = s.logger;
    this.stopDemo();
    s.reset();
    const steps = [
      [500, () => L.info('DEMO ▶ Phase 1 – nominal FANET operation over Dortmund')],
      [5000, () => { L.info('DEMO ▶ Phase 2 – hostile RF jammer activates in SECTOR OUEST'); s.setJamming(true); }],
      [16000, () => { L.info('DEMO ▶ Phase 3 – GNSS spoofer joins the attack'); s.setSpoofing(true); }],
      [28000, () => { L.info('DEMO ▶ Phase 4 – hardware failure on two relay nodes'); s.failNodes(2); }],
      [42000, () => { L.info('DEMO ▶ Phase 5 – operator triggers SAFE-RETURN-HOME'); s.setRTH(true); }],
      [62000, () => { L.info('DEMO ▶ Phase 6 – threat neutralised, mission resumes'); s.setRTH(false); s.setJamming(false); s.setSpoofing(false); }],
      [70000, () => { L.ok('DEMO ■ scenario complete'); this.stopDemo(); }],
    ];
    this.demoTimers = steps.map(([ms, fn]) => setTimeout(fn, ms));
    this.$('btnDemo').classList.add('running'); this.$('btnDemo').textContent = '■';
  }
  stopDemo(log) {
    this.demoTimers.forEach(clearTimeout); this.demoTimers = [];
    this.$('btnDemo').classList.remove('running'); this.$('btnDemo').textContent = '▶';
    if (log) this.sim.logger.info('DEMO ■ stopped by operator');
  }

  updateControls() {
    const s = this.sim, down = s.drones.filter(d => d.status === 'OFFLINE').length;
    this.$('btnJam').classList.toggle('active-red', s.env.jamming);
    this.$('btnSpoof').classList.toggle('active-amber', s.env.spoofing);
    this.$('btnFail').classList.toggle('active-red', down > 0);
    this.$('btnRth').classList.toggle('active-amber', s.rth);
    this.$('btnProt').className = `dock-pill ${s.protection ? 'prot-on' : 'prot-off'}`;
    this.$('protLabel').textContent = s.protection ? 'Protected' : 'Unprotected';
  }

  updateSource(state) {
    const box = this.$('srcBox');
    box.className = `status-pill ${state === 'LIVE' ? 'live' : 'mock'}`;
    this.$('srcLabel').textContent = { MOCK: 'MOCK', LIVE: 'LIVE · WS', CONNECTING: 'WAIT…', RECONNECTING: 'RETRY…' }[state] || state;
    this.$('wsBtn').textContent = state === 'MOCK' ? 'Connect' : 'Disconnect';
  }

  update() {
    const s = this.sim;
    let online = 0, fallback = 0, offline = 0;
    for (const d of s.drones) {
      const c = this.cards.get(d.id); if (!c) continue;
      const off = d.status === 'OFFLINE';
      if (off) offline++; else online++;
      if (!off && d.band === 'LORA') fallback++;

      let dotCls = 'st-dot', bandCls = 'drow-band', bandTxt = '2.4 GHz';
      if (off) {
        dotCls += ' off'; bandTxt = 'Offline';
      } else if (d.routeState === 'ISOLATED' || d.band === 'NONE' || d.gnss === 'LOST') {
        dotCls += ' crit'; bandCls += ' crit';
        bandTxt = d.gnss === 'LOST' ? 'GNSS Lost' : 'Isolated';
      } else if (d.band === 'LORA' || d.routeState === 'REROUTING' || d.gnss === 'SPOOFED') {
        dotCls += ' warn'; bandCls += ' warn';
        bandTxt = d.band === 'LORA' ? '868 MHz' : d.gnss === 'SPOOFED' ? 'Spoofed' : 'Rerouting';
      }
      c.dot.className = dotCls;
      c.band.className = bandCls;
      c.band.textContent = bandTxt;
      c.rtt.textContent = !off && d.routeState === 'OK' ? `${d.latency.toFixed(0)}ms` : '—';

      c.alt.textContent = `${d.alt.toFixed(0)} m`;
      c.spd.textContent = `${(d.speed * 3.6).toFixed(0)} km/h`;
      c.bat.textContent = `${d.battery.toFixed(0)}%`;
      c.hops.textContent = !off && d.routeState === 'OK' ? `${d.hops} (${d.route[1] || 'HQ'})` : '—';
      c.gnss.textContent = d.gnss === 'OK' ? '3D Fix' : d.gnss === 'LOST' ? 'INS Fallback' : 'Spoofed';
    }
    this.$('fcOnline').textContent = online;
    this.$('fcFallback').textContent = fallback;
    this.$('fcOffline').textContent = offline;

    const m = s.metrics;
    for (const key of Object.keys(this.gauges)) {
      const g = this.gauges[key], v = m.v[key], st = g.def.state(v);
      g.valWrap.className = `kpi-val${st === 'ok' ? '' : ' ' + st}`;
      g.num.textContent = key === 'recovery' && m.lastRecovery == null && !m.healing ? '0.0' : g.def.fmt(v);
    }
    const act = s.drones.filter(d => d.status === 'ONLINE' && d.routeState !== 'JOINING');
    this.gauges.reach.extra.textContent = `${act.filter(d => d.routeState === 'OK').length}/${act.length}`;
    this.gauges.latency.extra.textContent = `${s.net.links.length} links`;
    this.gauges.loss.extra.textContent = `${fallback} LoRa`;
    this.gauges.recovery.extra.textContent = m.healing ? 'Healing…' : m.recoveries.length ? `Avg ${m.avgRecovery.toFixed(1)}s` : 'Nominal';
    this.$('metricSrc').textContent = (m.isOverridden ? 'BACKEND' : this.bridge.state === 'LIVE' ? 'WS LIVE' : 'LIVE SIM') + (s.protection ? '' : ' · UNPROTECTED');

    for (const c of QOS_ROWS) {
      const st = s.traffic.stats[c.key]; if (!st) continue;
      const t = this.tc[c.key], pct = clamp(st.ratio * 100, 0, 100);
      t.fill.style.width = `${pct.toFixed(1)}%`;
      const bw = st.kbps >= 1000 ? `${(st.kbps / 1000).toFixed(1)} Mbps` : `${st.kbps.toFixed(1)} kbps`;
      t.meta.textContent = st.status === 'NOMINAL' ? `${bw} · 100%` : `${st.status} · ${pct.toFixed(0)}%`;
    }
    this.$('qosPolicy').textContent = s.traffic.policy;

    const reach = m.v.reach;
    const lvl = (s.env.jamming && s.env.spoofing) || reach < 80 ? 'CRITICAL' : s.env.jamming || s.env.spoofing || reach < 95 || offline ? 'ELEVATED' : 'NOMINAL';
    const th = this.$('hdrThreat');
    th.textContent = lvl;
    th.className = `toast-threat${lvl === 'CRITICAL' ? ' crit' : lvl === 'ELEVATED' ? ' warn' : ''}`;
    this.$('hdrMission').textContent = fmtDur(s.simTime);
    this.$('clock').textContent = hhmmss(new Date());
  }

  drawSparks() {
    const hist = this.sim.metrics.hist;
    for (const key of Object.keys(this.gauges)) {
      const g = this.gauges[key], cv = g.spark, data = hist[key];
      const w = cv.clientWidth, h = cv.clientHeight, dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(w * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
      if (data.length < 2) continue;
      const max = Math.max(g.def.max, ...data) * 1.05;
      const st = g.def.state(data[data.length - 1]);
      const col = st === 'crit' ? '#EF4444' : st === 'warn' ? '#F59E0B' : '#A1A1AA';
      const X = i => (i / (CFG.HISTORY - 1)) * w, Y = v => h - 2 - (v / max) * (h - 4);
      const off = CFG.HISTORY - data.length;
      ctx.beginPath();
      data.forEach((v, i) => (i ? ctx.lineTo(X(i + off), Y(v)) : ctx.moveTo(X(i + off), Y(v))));
      ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.stroke();
    }
  }

  appendLog(e) {
    if (e.level !== 'DBG') {
      this.$('toastTime').textContent = hhmmss(e.ts);
      this.$('toastMsg').textContent = e.msg;
      const dot = this.$('toastDot');
      dot.className = `toast-dot${e.level === 'CRIT' ? ' crit' : e.level === 'WARN' ? ' warn' : ''}`;
    }
    const host = this.$('log');
    const ln = document.createElement('div'); ln.className = `ln lv-${e.level}`;
    ln.innerHTML = `<span class="ts">${hhmmss(e.ts)}</span><span class="lv">${e.level}</span><span class="msg"></span>`;
    ln.querySelector('.msg').textContent = e.msg;
    host.appendChild(ln);
    while (host.children.length > 200) host.removeChild(host.firstChild);
    if (this.follow) host.scrollTop = host.scrollHeight;
  }
}

/* =====================================================================
 * 11. BOOT + PUBLIC API (window.AirShield / window.updateDroneData)
 * ===================================================================== */
const sim = new Simulation();
const map = new MapRenderer(document.getElementById('map'), sim);
const bridge = new BackendBridge(sim);
const ui = new UI(sim, map, bridge);

window.AirShield = {
  sim, map, bridge, CFG,
  /** Push drone telemetry: object, array, or {drones:[...]}. Fields: id, lat, lon, alt, battery, status, gnss, band */
  updateDroneData: p => sim.applyDroneData(p),
  /** Override resilience metrics: {reachability, latency_ms, packet_loss, recovery_s} */
  updateMetrics: m => sim.metrics.applyOverride(m),
  /** Override mesh links: [{a:'DR-01', b:'HQ', band:'2.4GHz'|'868MHz', quality:0..1}] */
  updateLinks: l => sim.net.applyExternal(l),
  /** Inject event: {type:'JAMMING'|'SPOOFING'|'NODE_FAILURE'|'NODE_RESTORE'|'RTH'|'ZONE'|'RESET', active, lat, lon, radius_m, ids} */
  injectEvent: e => sim.applyEvent(e),
  log: (msg, level = 'INFO') => sim.logger.log(level.toUpperCase(), msg),
  connect: url => bridge.connect(url),
  disconnect: () => bridge.disconnect(),
  poll: (url, ms) => bridge.poll(url, ms),
  stopPolling: () => bridge.stopPolling(),
  getState: () => sim.getState(),
  /** Subscribe to operator commands (button clicks) – also forwarded over WS */
  onCommand: cb => sim.on('command', cb),
};
window.updateDroneData = window.AirShield.updateDroneData;

const L = sim.logger;
L.info(`DORTMUND AIR SHIELD v${CFG.VERSION} – mission control online`);
L.info(`HQ ${CFG.HQ.name} · ${CFG.HQ.lat.toFixed(4)}°N ${CFG.HQ.lon.toFixed(4)}°E`);
L.net(`FANET bootstrap: ${sim.drones.length} nodes · primary 2.4 GHz mesh · fallback 868 MHz LoRa`);
L.debug('Backend hooks ready: window.AirShield.*, window.updateDroneData(), WebSocket, REST polling');

const params = new URLSearchParams(location.search);
if (params.get('ws')) { document.getElementById('wsUrl').value = params.get('ws'); bridge.connect(params.get('ws')); }
if (params.get('poll')) bridge.poll(params.get('poll'), +params.get('interval') || 1000);
if (params.get('protect') === '0') sim.setProtection(false);
if (params.get('demo') === '1') setTimeout(() => ui.runDemo(), 1500);

setInterval(() => {
  const ok = sim.drones.filter(d => d.status === 'ONLINE' && d.routeState === 'OK');
  if (!ok.length) return;
  const d = pick(ok);
  L.debug(`RX ${d.id} telemetry · ${d.band === 'LORA' ? '868M' : '2.4G'} · ${d.hops} hop${d.hops > 1 ? 's' : ''} · ${d.latency.toFixed(0)} ms`);
  if (sim.env.jamming && Math.random() < 0.35) L.net(`SPECTRUM ${sim.env.zone.sector}: 2.4 GHz noise floor −63 dBm (+38 dB) · LoRa SNR ${rand(-9, -4).toFixed(1)} dB`);
}, 3500);

let last = performance.now(), uiAcc = 1, sampleAcc = 0;
function frame() {
  const ts = performance.now(), dt = clamp((ts - last) / 1000, 0, 0.1); last = ts;
  sim.tick(dt);
  map.draw(dt);
  uiAcc += dt; if (uiAcc >= 0.25) { uiAcc = 0; ui.update(); }
  sampleAcc += dt; if (sampleAcc >= 0.5) { sampleAcc = 0; sim.metrics.sample(); ui.drawSparks(); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
