<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DORTMUND AIR SHIELD · Off-Grid Air Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090B;--map-bg:#0B0B0C;--road:#161618;
  --glass:rgba(24,24,27,0.75);--glass-hi:rgba(32,32,36,0.85);
  --border:rgba(255,255,255,0.07);--border-hi:rgba(255,255,255,0.14);
  --txt:#FAFAFA;--txt2:#A1A1AA;--mut:#71717A;
  --mint:#34D399;--amber:#F59E0B;--red:#EF4444;--blue:#38BDF8;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
html,body{width:100vw;height:100vh;background:var(--bg);color:var(--txt);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
button,input{font-family:inherit}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,0.12) transparent}
.scroll::-webkit-scrollbar{width:4px}
.scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:4px}
.hidden{display:none!important}

/* ---------- Full-Bleed Map & Floating Layout ---------- */
#app{position:relative;width:100vw;height:100vh;overflow:hidden;background:var(--map-bg)}
#mapWrap{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
#map{width:100%;height:100%;display:block;cursor:grab}
#map.dragging{cursor:grabbing}

.glass{
  background:var(--glass);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:20px;
  box-shadow:0 20px 50px rgba(0,0,0,0.45);
}

/* ---------- Top Center Toast + Collapsible Log Drawer ---------- */
.top-center{
  position:fixed;top:24px;left:50%;transform:translateX(-50%);
  z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;
  max-width:560px;width:calc(100vw - 740px);min-width:340px;pointer-events:none;
}
.toast-bar{
  pointer-events:auto;width:100%;display:flex;align-items:center;gap:10px;
  padding:10px 16px;border-radius:999px;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border);box-shadow:0 12px 32px rgba(0,0,0,0.4);
  transition:border-color .2s,background .2s;
}
.toast-bar:hover{border-color:var(--border-hi);background:var(--glass-hi)}
.toast-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex:none}
.toast-dot.warn{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.toast-dot.crit{background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.2s infinite}
.toast-time{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums;flex:none}
.toast-msg{font-size:12px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.toast-threat{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,0.06);color:var(--txt2);flex:none}
.toast-threat.warn{background:rgba(245,158,11,0.16);color:#FBBF24}
.toast-threat.crit{background:rgba(239,68,68,0.2);color:#F87171}
.toast-chev{color:var(--mut);font-size:10px;transition:transform .2s}
.toast-bar.open .toast-chev{transform:rotate(180deg)}

.log-drawer{
  pointer-events:auto;width:100%;max-height:240px;padding:12px 14px;
  display:flex;flex-direction:column;gap:8px;
}
.drawer-head{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.drawer-actions{display:flex;gap:6px}
.mini-btn{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--txt2);font-size:10px;font-weight:500;padding:3px 8px;border-radius:8px;cursor:pointer}
.mini-btn:hover{color:var(--txt);border-color:var(--border-hi)}
.terminal{font-family:var(--mono);font-size:11px;line-height:1.55;max-height:180px}
.terminal .ln{display:flex;gap:8px;padding:1px 0}
.terminal .ts{color:var(--mut);flex:none}
.terminal .lv{width:34px;flex:none;font-weight:600}
.terminal .msg{color:var(--txt2);word-break:break-word}
.lv-INFO .lv{color:var(--blue)}.lv-OK .lv{color:var(--mint)}.lv-WARN .lv{color:var(--amber)}.lv-CRIT .lv{color:var(--red)}.lv-NET .lv{color:#A78BFA}.lv-DBG .lv{color:var(--mut)}

/* ---------- Left Floating Panel (Fleet) ---------- */
#left{
  position:fixed;top:24px;left:24px;bottom:24px;width:320px;z-index:10;
  display:flex;flex-direction:column;padding:18px;gap:14px;
}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-left{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--txt)}
.brand-title{font-size:14px;font-weight:600;letter-spacing:-0.01em;color:var(--txt)}
.brand-sub{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-top:2px}
.status-pill{display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:999px;font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--txt2);cursor:pointer}
.status-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--txt2)}
.status-pill.live{color:var(--mint);border-color:rgba(52,211,153,0.25)}.status-pill.live .dot{background:var(--mint);box-shadow:0 0 8px var(--mint)}
.status-pill.mock .dot{background:var(--amber)}

.ws-bar{display:flex;gap:6px;align-items:center}
#wsUrl{flex:1;background:rgba(0,0,0,0.3);border:1px solid var(--border);border-radius:10px;color:var(--txt2);font-size:11px;padding:6px 10px;outline:none}
#wsUrl:focus{border-color:var(--border-hi);color:var(--txt)}
#wsBtn{background:rgba(255,255,255,0.07);border:1px solid var(--border);color:var(--txt);font-size:11px;font-weight:500;padding:6px 10px;border-radius:10px;cursor:pointer}
#wsBtn:hover{background:rgba(255,255,255,0.12)}

.sec-hdr{display:flex;align-items:center;justify-content:space-between;font-size:10px;font-weight:600;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.fleet-summary{display:flex;gap:12px;font-size:11px;color:var(--txt2)}
.fleet-summary b{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums}

.fleet-list{flex:1;display:flex;flex-direction:column;gap:2px;margin:0 -6px;padding:0 6px}
.drow{
  border-radius:12px;border:1px solid transparent;
  transition:background .15s,border-color .15s;overflow:hidden;
}
.drow:hover{background:rgba(255,255,255,0.035)}
.drow.selected{background:rgba(255,255,255,0.06);border-color:var(--border-hi)}
.drow-main{
  height:40px;padding:0 10px;display:flex;align-items:center;gap:9px;cursor:pointer;
  font-size:12px;font-variant-numeric:tabular-nums;
}
.st-dot{width:7px;height:7px;border-radius:50%;background:var(--mint);flex:none}
.st-dot.warn{background:var(--amber);box-shadow:0 0 8px rgba(245,158,11,0.7)}
.st-dot.crit{background:var(--red);box-shadow:0 0 8px rgba(239,68,68,0.8)}
.st-dot.off{background:#52525B}
.drow-id{font-weight:600;color:var(--txt)}
.drow-ip{font-size:11px;color:var(--mut)}
.drow-band{margin-left:auto;font-size:11px;color:var(--txt2);font-weight:500}
.drow-band.warn{color:var(--amber)}
.drow-band.crit{color:var(--red)}
.drow-rtt{width:42px;text-align:right;font-size:11px;color:var(--mut)}

.drow-detail{
  display:none;padding:6px 10px 12px 26px;
  border-top:1px solid rgba(255,255,255,0.04);
  grid-template-columns:repeat(3,1fr);gap:8px;
}
.drow.selected .drow-detail{display:grid}
.dd-cell span{display:block;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.dd-cell b{display:block;font-size:12px;font-weight:500;color:var(--txt);margin-top:2px;font-variant-numeric:tabular-nums}

.left-foot{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border);font-size:11px;color:var(--mut)}
.seg{display:flex;background:rgba(0,0,0,0.28);border:1px solid var(--border);border-radius:8px;padding:2px}
.seg button{background:none;border:0;color:var(--mut);font-size:10px;font-weight:600;padding:3px 7px;border-radius:6px;cursor:pointer}
.seg button.on{background:rgba(255,255,255,0.1);color:var(--txt)}

/* ---------- Right Floating Panel (Measurable Resilience) ---------- */
#right{
  position:fixed;top:24px;right:24px;width:336px;z-index:10;
  display:flex;flex-direction:column;padding:18px;gap:18px;
}
.kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{
  background:rgba(255,255,255,0.025);border:1px solid var(--border);
  border-radius:14px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:4px;
}
.kpi-label{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.kpi-val{font-size:32px;font-weight:500;line-height:1.05;letter-spacing:-0.03em;color:var(--txt);font-variant-numeric:tabular-nums;margin-top:2px;transition:color .25s}
.kpi-val .unit{font-size:13px;font-weight:500;color:var(--mut);margin-left:3px;letter-spacing:0}
.kpi-val.warn{color:var(--amber)}
.kpi-val.crit{color:var(--red)}
.kpi-sub{font-size:10px;color:var(--mut);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
.kpi-spark{width:100%;height:24px;display:block;margin-top:4px}

.qos-list{display:flex;flex-direction:column;gap:11px}
.qos-row{display:flex;flex-direction:column;gap:5px}
.qos-head{display:flex;align-items:center;justify-content:space-between;font-size:11px}
.qos-name{font-weight:500;color:var(--txt);display:flex;align-items:center;gap:6px}
.qos-dot{width:6px;height:6px;border-radius:50%}
.qos-meta{font-size:10px;color:var(--mut);font-variant-numeric:tabular-nums}
.qos-track{height:4px;border-radius:999px;background:rgba(255,255,255,0.07);overflow:hidden}
.qos-fill{height:100%;border-radius:999px;transition:width .3s ease,background .3s}

/* ---------- Bottom Floating Action Dock (Tesla Quick Controls) ---------- */
.bottom-dock{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:15;
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;
}
.dock-pill{
  display:flex;align-items:center;gap:8px;padding:9px 15px;border-radius:999px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  color:var(--txt2);font-size:12px;font-weight:500;cursor:pointer;
  transition:all .2s ease;white-space:nowrap;
}
.dock-pill svg{ opacity:.8;flex:none }
.dock-pill:hover{background:rgba(255,255,255,0.08);color:var(--txt);border-color:var(--border-hi)}
.dock-pill:active{transform:scale(0.98)}
.dock-pill.active-red{
  background:rgba(239,68,68,0.16);border-color:rgba(239,68,68,0.55);color:#FCA5A5;
  box-shadow:0 0 24px rgba(239,68,68,0.3);
}
.dock-pill.active-amber{
  background:rgba(245,158,11,0.16);border-color:rgba(245,158,11,0.55);color:#FDE68A;
  box-shadow:0 0 24px rgba(245,158,11,0.28);
}
.dock-pill.prot-on{background:rgba(52,211,153,0.10);border-color:rgba(52,211,153,0.40);color:#6EE7B7}
.dock-pill.prot-off{
  background:rgba(239,68,68,0.18);border-color:rgba(239,68,68,0.65);color:#FCA5A5;
  box-shadow:0 0 24px rgba(239,68,68,0.35);
}
.dock-div{width:1px;height:20px;background:var(--border);margin:0 2px}
.dock-icon-btn{
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);color:var(--txt2);
  cursor:pointer;font-size:12px;transition:all .2s;
}
.dock-icon-btn:hover{background:rgba(255,255,255,0.09);color:var(--txt)}
.dock-icon-btn.running{color:var(--amber);border-color:rgba(245,158,11,0.5)}

/* ---------- Map Floating Card (Selected Drone Only) & Map Zoom ---------- */
.node-card{
  position:fixed;z-index:12;pointer-events:none;
  width:230px;padding:13px 14px;border-radius:16px;
  background:rgba(18,18,21,0.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid var(--border-hi);box-shadow:0 16px 40px rgba(0,0,0,0.55);
  font-size:11px;color:var(--txt2);transform:translate(-50%,-100%);margin-top:-18px;
}
.nc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.nc-id{font-size:13px;font-weight:600;color:var(--txt)}
.nc-badge{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:rgba(52,211,153,0.15);color:var(--mint)}
.nc-badge.warn{background:rgba(245,158,11,0.18);color:var(--amber)}
.nc-badge.crit{background:rgba(239,68,68,0.2);color:var(--red)}
.nc-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-variant-numeric:tabular-nums}
.nc-grid span{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);display:block}
.nc-grid b{font-size:12px;font-weight:500;color:var(--txt)}
.nc-route{margin-top:8px;padding-top:7px;border-top:1px solid var(--border);font-size:10px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.map-zoom{
  position:fixed;right:24px;bottom:24px;z-index:10;display:flex;gap:6px;
}
.zbtn{
  width:34px;height:34px;border-radius:12px;display:grid;place-items:center;
  background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--border);
  color:var(--txt2);font-size:14px;cursor:pointer;
}
.zbtn:hover{color:var(--txt);border-color:var(--border-hi)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<div id="app">
  <!-- ================= FULL-BLEED MAP ================= -->
  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="nodeCard" class="node-card hidden"></div>
  </main>

  <!-- ================= TOP CENTER: 1-LINE LIVE TOAST + DRAWER ================= -->
  <div class="top-center">
    <div class="toast-bar" id="toastBar" title="Click to toggle event log drawer">
      <span class="toast-dot" id="toastDot"></span>
      <span class="toast-time" id="toastTime">00:00:00</span>
      <span class="toast-msg" id="toastMsg">Dortmund Air Shield initialized</span>
      <span class="toast-threat" id="hdrThreat">NOMINAL</span>
      <span class="toast-chev">▾</span>
    </div>
    <div class="glass log-drawer hidden" id="logDrawer">
      <div class="drawer-head">
        <span>System Event Log · <b id="hdrMission" style="color:var(--txt)">00:00:00</b></span>
        <div class="drawer-actions">
          <button class="mini-btn" id="logFollow">Auto-Scroll</button>
          <button class="mini-btn" id="logClear">Clear</button>
        </div>
      </div>
      <div class="terminal scroll" id="log"></div>
    </div>
  </div>

  <!-- ================= LEFT FLOATING PANEL: COMPACT FLEET ================= -->
  <aside class="glass" id="left">
    <div class="brand-row">
      <div class="brand-left">
        <div class="logo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L4.5 20.29l.71.71L12 18l6.79 3 .71-.71z"/>
          </svg>
        </div>
        <div>
          <div class="brand-title">Dortmund Air Shield</div>
          <div class="brand-sub" id="fleetCount">10 Nodes · FANET</div>
        </div>
      </div>
      <div class="status-pill mock" id="srcBox" title="Toggle WebSocket config">
        <span class="dot"></span><span id="srcLabel">MOCK</span>
      </div>
    </div>

    <div class="ws-bar hidden" id="wsBar">
      <input id="wsUrl" value="ws://localhost:8765" spellcheck="false" title="Backend WebSocket URL">
      <button id="wsBtn">Connect</button>
    </div>

    <div class="sec-hdr">
      <span>Fleet Telemetry</span>
      <div class="fleet-summary">
        <span><b id="fcOnline">10</b> Online</span>
        <span><b id="fcFallback">0</b> LoRa</span>
        <span><b id="fcOffline">0</b> Off</span>
      </div>
    </div>

    <div class="fleet-list scroll" id="fleetList"></div>

    <div class="left-foot">
      <span id="clock">--:--:--</span>
      <div class="seg" id="speedSeg" title="Simulation speed">
        <button data-speed="0">❚❚</button>
        <button data-speed="1">1×</button>
        <button data-speed="6" class="on">6×</button>
        <button data-speed="20">20×</button>
      </div>
    </div>
  </aside>

  <!-- ================= RIGHT FLOATING PANEL: MEASURABLE RESILIENCE ================= -->
  <aside class="glass" id="right">
    <div class="sec-hdr">
      <span>Measurable Resilience</span>
      <span id="metricSrc">LIVE SIM</span>
    </div>
    <div class="kpi-grid" id="gauges"></div>

    <div class="sec-hdr" style="margin-top:2px">
      <span>Traffic Priorities (QoS)</span>
      <span id="qosPolicy" style="color:var(--txt2)">NOMINAL</span>
    </div>
    <div class="qos-list" id="traffic"></div>
  </aside>

  <!-- ================= BOTTOM FLOATING DOCK: TESLA QUICK CONTROLS ================= -->
  <nav class="glass bottom-dock">
    <button class="dock-pill prot-on" id="btnProt" title="Toggle all automatic defenses to compare · Shortcut: P">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Z"/></svg>
      <span id="protLabel">Protected</span>
    </button>
    <div class="dock-div"></div>
    <button class="dock-pill" id="btnJam" title="Shortcut: J">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 12h3l2-6 3 12 3-9 2 5 2-2h5"/></svg>
      <span>Jamming</span>
    </button>
    <button class="dock-pill" id="btnSpoof" title="Shortcut: G">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="10" r="3"/><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11Z"/></svg>
      <span>GPS Spoofing</span>
    </button>
    <button class="dock-pill" id="btnFail" title="Shortcut: F">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/></svg>
      <span>Node Failure</span>
    </button>
    <button class="dock-pill" id="btnRth" title="Shortcut: R">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
      <span>Return Home</span>
    </button>
    <div class="dock-div"></div>
    <button class="dock-icon-btn" id="btnDemo" title="Run Demo Scenario">▶</button>
    <button class="dock-icon-btn" id="btnReset" title="Reset Simulation">↺</button>
  </nav>

  <!-- ================= MAP ZOOM CONTROLS ================= -->
  <div class="map-zoom">
    <button class="zbtn" id="zIn" title="Zoom in">+</button>
    <button class="zbtn" id="zOut" title="Zoom out">−</button>
    <button class="zbtn" id="zFit" title="Reset view">⌖</button>
  </div>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
 * 1. CONFIG & FLEET DEFINITION
 * ===================================================================== */
const CFG = {
  VERSION: '1.0.0',
  ORIGIN: { lat: 51.5136, lon: 7.4653 },
  HQ: { lat: 51.5150, lon: 7.4560, alt: 45, name: 'CONTROL CENTER DORTMUND' },
